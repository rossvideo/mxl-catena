<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MXL Demo — Landing</title>
  <link rel="stylesheet" href="/public/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">MXL Demo</div>
    <nav class="nav">
      <a class="btn" href="/">README</a>
      <a class="btn" id="btn-mp42ts" href="http://localhost:3000" target="_blank" rel="noopener noreferrer">
        <span class="led" id="led-mp42ts" title="MP4→TS stream status"></span>
        MP4 → TS
      </a>
      <a class="btn" id="btn-ts2mxl" href="#ts2mxl">
        <span class="led" id="led-ts2mxl" title="TS→MXL conversion status"></span>
        TS → MXL
      </a>
      <a class="btn" id="btn-mxl2ndi" href="#mxl2ndi">
        <span class="led" id="led-mxl2ndi" title="MXL→NDI conversion status"></span>
        MXL → NDI
      </a>
    </nav>
  </header>
  <main class="content">
    {{content}}
  </main>
  <script>
    // Transform fenced ```mermaid code blocks into <div class="mermaid"> so mermaid can render
    document.addEventListener('DOMContentLoaded', () => {
      const blocks = document.querySelectorAll('pre > code.language-mermaid');
      blocks.forEach(code => {
        const pre = code.parentElement;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent || '';
        if (pre && pre.parentElement) {
          pre.parentElement.replaceChild(div, pre);
        }
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.min.js"></script>
  <script>
    // Initialize Mermaid after transforming blocks
    mermaid.initialize({ startOnLoad: true });
  </script>
  <script src="/public/app.js"></script>
</body>

</html>
